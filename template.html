<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>医学综合·冲刺刷题 — 成人高考专升本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="医学刷题">
<style>
:root {
  --bg:#f0f2f5; --card:#fff; --text:#1a1a2e; --sub:#666; --muted:#999;
  --accent:#0ea5e9; --accent2:#6366f1; --correct:#10b981; --wrong:#ef4444;
  --warn:#f59e0b; --border:#e5e7eb; --shadow:0 2px 12px rgba(0,0,0,.08);
  --radius:14px; --panel-w:30px;
}
[data-theme="dark"] {
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --sub:#94a3b8; --muted:#64748b;
  --border:#334155; --shadow:0 2px 12px rgba(0,0,0,.35);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; transition:background .3s; }
/* iOS PWA（standalone + black-translucent）下，页面顶到状态栏后面。
   用一条与页面同色的实心条垫住状态栏区域，避免 iOS 26「液态玻璃」把页面顶部套上模糊。 */
body::before { content:''; position:fixed; top:0; left:0; right:0;
  height:env(safe-area-inset-top, 0px); background:var(--bg); z-index:200; pointer-events:none; }
#app { max-width:1000px; margin:0 auto; padding:20px 20px 90px; }
.hidden{display:none!important;}

/* 顶部导航 */
.topbar { display:flex; align-items:center; gap:10px; padding:0 4px 18px; flex-wrap:wrap; }
.topbar .brand { font-weight:800; font-size:18px; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.topbar .sp { flex:1; }
.tab-btn { padding:8px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:13px; cursor:pointer; transition:all .2s; }
.tab-btn:hover { border-color:var(--accent); color:var(--accent); }
.tab-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

/* 卡片通用 */
.card { background:var(--card); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:18px; }
.card h2 { font-size:18px; margin-bottom:12px; }
.card p { color:var(--sub); font-size:14px; line-height:1.8; }

/* 网课要点卡片 */
.lect-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; cursor:pointer; }
.lect-card:hover { border-color:var(--accent); }
.lect-head { display:flex; align-items:center; gap:12px; padding:14px 16px; }
.lect-no { background:var(--accent); color:#fff; font-size:12px; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap; }
.lect-title { font-size:15px; font-weight:700; }
.lect-meta { color:var(--muted); font-size:12px; margin-left:auto; white-space:nowrap; }
.lect-arw { color:var(--accent); font-size:14px; transition:transform .2s; }
.lect-body { padding:0 16px 14px; border-top:1px solid var(--border); }
.lect-pts { margin:12px 0; padding-left:20px; }
.lect-pts li { font-size:13.5px; line-height:1.7; color:var(--text); margin-bottom:4px; }
.lect-file { font-size:12px; color:var(--muted); background:var(--bg); padding:8px 10px; border-radius:8px; }
/* 内联 Markdown 正文 */
.lec-md { font-size:14px; line-height:1.75; color:var(--text); padding:4px 2px; }
.lec-md h2 { font-size:20px; margin:18px 0 8px; }
.lec-md h3 { font-size:17px; margin:16px 0 6px; color:var(--accent); }
.lec-md h4 { font-size:15px; margin:12px 0 4px; }
.lec-md p { margin:6px 0; }
.lec-md ul { margin:6px 0 6px 22px; }
.lec-md li { margin:3px 0; }
.lec-md blockquote { border-left:3px solid var(--accent); margin:10px 0; padding:6px 12px; background:var(--bg); color:var(--sub); border-radius:0 8px 8px 0; }
.lec-md hr { border:none; border-top:1px solid var(--border); margin:14px 0; }
.lec-md table.lec-tbl { width:100%; border-collapse:collapse; margin:10px 0; font-size:13px; }
.lec-md table.lec-tbl th, .lec-md table.lec-tbl td { border:1px solid var(--border); padding:6px 8px; text-align:left; }
.lec-md table.lec-tbl th { background:var(--bg); font-weight:700; }
.lec-sum { border-color:var(--accent); }
.lec-sum .lect-title { color:var(--accent); }
.lec-sec-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:18px 0 6px; }
.lec-sec-head h3 { margin:0; }
.lec-practice { flex-shrink:0; font-size:13px; padding:7px 14px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
.lec-practice:hover { opacity:.88; }
.lec-code { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; white-space:pre-wrap; line-height:1.6; overflow-x:auto; }
/* 知识地图流程图 */
.lec-flow { display:flex; flex-direction:column; align-items:stretch; gap:0; margin:14px 0; }
.flow-node { border:1px solid var(--accent); background:linear-gradient(180deg, rgba(14,165,233,.06), rgba(14,165,233,.02)); border-radius:10px; padding:12px 16px; }
.flow-stage { font-weight:700; color:var(--foreground); font-size:15px; }
.flow-tags { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
.flow-tag { background:var(--card); border:1px solid var(--border); border-radius:6px; padding:3px 9px; font-size:13px; color:var(--muted-foreground); }
.flow-arrow { text-align:center; color:var(--accent); font-size:14px; line-height:1.2; padding:3px 0; }

/* 模拟考试 / 设置页 */
.range-row { margin:16px 0; }
.range-row label { display:flex; justify-content:space-between; font-size:14px; margin-bottom:6px; }
.range-row label b { color:var(--accent); font-size:16px; }
input[type=range]{ width:100%; accent-color:var(--accent); }
.exam-timer { font-size:22px; font-weight:800; color:var(--accent); text-align:center; margin:10px 0; }
.exam-timer.warn { color:var(--danger,#e53e3e); }
.report-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; }
.report-score { font-size:42px; font-weight:800; text-align:center; }
.report-pass { color:var(--accent); } .report-fail { color:#e53e3e; }
.set-item { display:flex; flex-direction:column; gap:8px; padding:14px 0; border-bottom:1px solid var(--border); }
.set-item:last-child { border-bottom:none; }
.set-item .desc { font-size:12px; color:var(--muted); }
.switch { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.btn-mini { font-size:12px; padding:6px 12px; }
.spaced { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
.hidden-file { display:none; }

.home-hero { text-align:center; padding:22px 0 6px; }
.home-hero h1 { font-size:28px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.home-hero .sub { color:var(--sub); margin-top:8px; font-size:14px; }
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin:20px 0; }
.stats-grid .s-item { background:var(--bg); border-radius:10px; padding:16px; text-align:center; }
.stats-grid .s-item .n { font-size:26px; font-weight:800; color:var(--accent); }
.stats-grid .s-item .l { font-size:11px; color:var(--muted); margin-top:3px; }
.prog-wrap { background:var(--bg); border-radius:10px; padding:14px 16px; margin-bottom:18px; }
.mini-cta { margin-top:10px; width:100%; padding:6px 10px; font-size:12px; border:1px solid var(--border); background:transparent; color:var(--accent); border-radius:8px; cursor:pointer; transition:all .15s; }
.mini-cta:hover { background:rgba(127,127,255,.08); border-color:var(--accent); }
.stats-grid .s-item.undone { display:flex; flex-direction:column; align-items:center; justify-content:center; }
.prog-bar { height:12px; background:var(--border); border-radius:6px; overflow:hidden; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:6px; transition:width .4s; }
.prog-label { font-size:13px; color:var(--sub); margin-top:8px; }
.prog-label b { color:var(--accent); }
.mode-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin:16px 0; }
.mode-btn { padding:16px; border-radius:12px; border:2px solid var(--border); background:var(--card); color:var(--text); text-align:left; cursor:pointer; transition:all .2s; }
.mode-btn b { font-size:15px; display:block; margin-bottom:4px; }
.mode-btn span { font-size:12px; color:var(--muted); }
.mode-btn:hover { border-color:var(--accent); transform:translateY(-2px); }
.mode-btn.weak { border-color:var(--warn); }
.mode-btn.weak b { color:var(--warn); }
.mode-btn.sel { border-color:var(--accent); background:rgba(14,165,233,.09); box-shadow:0 0 0 2px rgba(14,165,233,.15); }
.mode-btn.sel b { color:var(--accent); }
.mode-btn.sel span { color:var(--text); }
.mode-btn.weak.sel { border-color:var(--warn); background:rgba(245,158,11,.10); box-shadow:0 0 0 2px rgba(245,158,11,.18); }
.mode-btn.weak.sel b { color:var(--warn); }
.mode-btn .mark { display:inline-block; width:14px; height:14px; border-radius:50%; border:2px solid var(--muted); margin-right:7px; vertical-align:-2px; transition:all .2s; }
.mode-btn.sel .mark { border-color:var(--accent); background:var(--accent); box-shadow:inset 0 0 0 3px var(--card); }
.mode-btn.weak.sel .mark { border-color:var(--warn); background:var(--warn); box-shadow:inset 0 0 0 3px var(--card); }
.big-start { display:block; width:100%; padding:15px; border:none; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:17px; font-weight:700; cursor:pointer; margin-top:6px; }
.big-start:hover { opacity:.92; }

/* 刷题页 */
.q-wrap { display:grid; grid-template-columns:1fr 250px; gap:18px; }
/* 竖屏手机：单列（右侧面板沉底） */
@media(max-width:760px){ .q-wrap{grid-template-columns:1fr;} }
/* 中等屏（含 iPhone 横屏 ~932px）：保持双栏，题目区紧凑 */
@media(max-width:1100px) and (min-width:761px){
  .q-card{padding:16px;}
  .q-stem{font-size:15px;line-height:1.7;margin:12px 0 14px;}
  .options{gap:8px;}
  .option{padding:10px 12px;font-size:14px;border-radius:10px;}
  .option .letter{width:24px;height:24px;font-size:13px;margin-right:10px;}
  .confirm-bar{margin-top:12px;}
  .feedback{padding:12px;margin-top:12px;font-size:14px;line-height:1.6;}
  .feedback .explain{padding:10px 12px;font-size:13px;line-height:1.7;}
  .next-hint{margin-top:12px;font-size:11px;}
}
/* 窄屏（手机竖屏/小窗）：整体紧凑 */
.mobile-next{display:none;}      /* 默认（桌面）隐藏；下面的手机媒体查询里改为固定底部 */
.mobile-exambar{display:none;}    /* 同上 */

@media(max-width:760px){
  #app{padding:calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 92px);}
  .topbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 0 12px;}
  .topbar .brand{grid-column:1 / -1;text-align:center;font-size:17px;margin-bottom:2px;}
  .topbar .sp{display:none;}
  .tab-btn{padding:8px 2px;font-size:12.5px;text-align:center;border-radius:9px;}
  .q-card{padding:14px;}
  .q-stem{font-size:15px;line-height:1.7;margin:12px 0 14px;}
  .options{gap:8px;}
  .option{padding:10px 12px;font-size:14px;border-radius:10px;}
  .option .letter{width:24px;height:24px;font-size:13px;margin-right:10px;}
  .confirm-bar{margin-top:12px;}
  .feedback{padding:12px;margin-top:12px;font-size:14px;line-height:1.6;}
  .feedback .explain{padding:10px 12px;font-size:13px;line-height:1.7;}
  .next-hint{margin-top:12px;font-size:11px;}
  .side{padding:14px;position:static;max-height:none;}
  .side .big{font-size:26px;}
  .side .p-row{padding:6px 0;font-size:12px;}
  .side .dots{gap:3px;}
  .side .dot{width:15px;height:15px;font-size:10px;}
  .card{padding:14px;margin-bottom:12px;}
  .card h2{font-size:16px;margin-bottom:8px;}
  .home-hero h1{font-size:22px;}
  .home-hero .sub{font-size:12px;}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0;}
  .stats-grid .s-item{padding:10px 4px;border-radius:9px;}
  .stats-grid .s-item .n{font-size:20px;}
  .stats-grid .s-item .l{font-size:10.5px;}
  .stats-grid .s-item.undone{grid-column:1 / -1;flex-direction:row;gap:12px;padding:10px 14px;justify-content:flex-start;}
  .stats-grid .s-item.undone .n{font-size:22px;}
  .stats-grid .s-item.undone .l{font-size:11.5px;text-align:left;flex:1;}
  .stats-grid .s-item.undone .mini-cta{margin-top:0;width:auto;flex-shrink:0;padding:7px 12px;}
  .prog-wrap{padding:12px 14px;margin-bottom:14px;}
  .prog-label{font-size:12px;}
  .home-hero{padding:14px 0 4px;}
  .home-hero h1{font-size:21px;}
  .home-hero .sub{font-size:11.5px;line-height:1.65;margin-top:6px;}
  .mode-grid{gap:8px;margin:10px 0;}
  .mode-btn{padding:10px 12px;}
  /* 单列时答题后固定底部"下一题" */
  .mobile-next{display:block;position:fixed;left:10px;right:10px;
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:60;}
  .mobile-next .btn{width:100%;padding:13px;font-size:16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  /* 考试模式：固定底栏（上一题/下一题/交卷） */
  .mobile-exambar{display:flex;position:fixed;left:10px;right:10px;
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:60;gap:10px;}
  .mobile-exambar .btn{flex:1;padding:13px;font-size:16px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.25);}
  #app{padding-bottom:100px;}   /* 给固定底栏留空间，避免内容被遮 */
}
.q-card { background:var(--card); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow); border:1px solid var(--border); }
.q-tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; margin-right:8px; }
.q-tag.tf { background:#dbeafe; color:#1d4ed8; }
.q-tag.sel { background:#fef3c7; color:#b45309; }
.q-tag.multi { background:#dcfce7; color:#15803d; }
.q-meta { font-size:13px; color:var(--sub); }
.q-stem { font-size:17px; line-height:1.85; margin:20px 0 22px; }
.options { display:flex; flex-direction:column; gap:10px; }
.option { display:flex; align-items:center; padding:13px 16px; border:2px solid var(--border); border-radius:12px; cursor:pointer; transition:all .2s; font-size:15px; }
.option:hover { border-color:var(--accent); }
.option .letter { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:var(--border); margin-right:12px; font-weight:700; font-size:14px; flex-shrink:0; transition:all .2s; }
.option.multi-tog.selected { border-color:var(--accent); background:rgba(14,165,233,.08); }
.option.selected { border-color:var(--accent); background:rgba(14,165,233,.10); }
.option.selected .letter { background:var(--accent); color:#fff; }
.option.correct { border-color:var(--correct); background:rgba(16,185,129,.1); }
.option.correct .letter { background:var(--correct); color:#fff; }
.option.wrong { border-color:var(--wrong); background:rgba(239,68,68,.1); }
.option.wrong .letter { background:var(--wrong); color:#fff; }
.option.dim { opacity:.45; }
.confirm-bar { margin-top:16px; }
.btn { padding:12px 22px; border-radius:10px; border:none; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--accent); color:#fff; }
.btn-primary:hover { background:var(--accent2); }
.btn-ghost { background:transparent; border:2px solid var(--accent); color:var(--accent); }
.btn-ghost:hover { background:var(--accent); color:#fff; }
.btn-danger { background:transparent; border:2px solid var(--wrong); color:var(--wrong); }
.btn-danger:hover { background:var(--wrong); color:#fff; }
.btn-mini { padding:6px 14px; font-size:13px; }
.feedback { padding:16px; border-radius:12px; margin-top:18px; font-size:15px; line-height:1.7; animation:fadeIn .25s; }
.feedback.ok { background:rgba(16,185,129,.1); border:1px solid var(--correct); }
.feedback.err { background:rgba(239,68,68,.1); border:1px solid var(--wrong); }
.feedback .explain { margin-top:12px; padding:14px 16px; background:var(--bg); border-radius:10px; font-size:14px; line-height:1.8; color:var(--text); border-left:3px solid var(--accent); white-space:pre-wrap; }
.feedback .explain .exp-title { font-weight:700; color:var(--accent); margin-bottom:6px; }
.exp-toggle { font-size:13px; color:var(--accent); cursor:pointer; text-decoration:underline; margin-left:6px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }
.next-hint { font-size:12px; color:var(--muted); margin-top:16px; }
.next-hint kbd { background:var(--border); padding:2px 8px; border-radius:4px; }

/* 侧栏 */
.side { background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); height:fit-content; position:sticky; top:20px; max-height:calc(100vh - 40px); display:flex; flex-direction:column; }
.side-top { flex-shrink:0; }
.side-scroll { flex:1; min-height:0; overflow-y:auto; }
.side-scroll::-webkit-scrollbar { width:4px; }
.side-scroll::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.side .side-actions { display:flex; flex-direction:column; gap:8px; margin-top:12px; flex-shrink:0; border-top:1px solid var(--border); padding-top:12px; }
.side .side-actions .btn { width:100%; }
.side .p-title { font-size:13px; font-weight:700; color:var(--sub); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
.side .big { font-size:32px; font-weight:800; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; text-align:center; }
.side .label { font-size:11px; color:var(--muted); text-align:center; margin-top:2px; }
.side .p-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
.side .p-row .green { color:var(--correct); font-weight:700; }
.side .p-row .red { color:var(--wrong); font-weight:700; }
.side .p-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:10px 0; }
.side .p-bar-fill { height:100%; background:var(--correct); border-radius:3px; }

/* 相似题 / 速记 页面 */
.sim-group { background:var(--card); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); border:1px solid var(--border); margin-bottom:16px; }
.sim-group .g-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sim-group .g-type { font-size:11px; padding:2px 8px; border-radius:5px; font-weight:700; }
.sim-group.g-contrast .g-type { background:#fee2e2; color:#b91c1c; }
.sim-group.g-variant .g-type { background:#e0e7ff; color:#4338ca; }
.sim-group.g-dup .g-type { background:#fef3c7; color:#b45309; }
.sim-group .g-title { font-weight:700; font-size:15px; }
.sim-item { padding:10px 12px; border-radius:8px; background:var(--bg); margin:8px 0; font-size:14px; line-height:1.7; }
.sim-item .tag { font-weight:700; color:var(--accent); margin-right:8px; }
.sim-ans { margin-top:6px; font-size:13px; color:var(--sub); }
.sim-ans b { color:var(--correct); }
.sim-diff { margin-top:10px; font-size:12px; color:var(--warn); }

/* 完整题目卡片（纯记忆题 & 相似题富化） */
.fullq { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:8px 0; }
.fq-tag { display:inline-block; font-size:11px; padding:2px 9px; border-radius:5px; background:var(--accent); color:#fff; margin-bottom:6px; font-weight:700; }
.fq-stem { font-size:14px; line-height:1.7; }
.fq-opts { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
.fq-opts .opt { display:flex; gap:8px; font-size:13px; align-items:center; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:4px 8px; }
.fq-opts .opt .ol { font-weight:700; color:var(--accent); min-width:16px; }
.fq-opts .opt.ans { border-color:var(--correct); background:rgba(16,185,129,.08); }
.fq-opts .opt.ans .ol { color:var(--correct); }
.fq-ans { font-size:13px; }
.fq-ans b { color:var(--correct); }
.memo-sec { margin-bottom:20px; }
.memo-sec h2 { font-size:16px; color:var(--accent); margin-bottom:10px; }
.memo-count { font-size:13px; color:var(--muted); font-weight:400; margin-left:6px; }
.filter-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.filter-chip { padding:6px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--sub); font-size:13px; cursor:pointer; }
.filter-chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.search-box { width:100%; padding:12px 16px; border-radius:10px; border:2px solid var(--border); background:var(--card); color:var(--text); font-size:15px; margin-bottom:16px; outline:none; }
.search-box:focus { border-color:var(--accent); }

/* 速记卡片 */
.kn-cat { margin-bottom:18px; }
.kn-cat h3 { font-size:14px; color:var(--accent); margin-bottom:10px; }
.kn-item { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:12px 14px; margin-bottom:8px; font-size:14px; line-height:1.7; }
.kn-item b { color:var(--accent); }

/* 答题轨迹点 */
.side .dots-wrap { border-bottom:1px solid var(--border); margin-bottom:4px; }
.side .dots-wrap .p-row { border-bottom:none; }
.side .dots { display:flex; flex-wrap:wrap; gap:4px; padding:4px 0 8px; }
.side .dot { width:18px; height:18px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:11px; color:#fff; font-weight:700; }
.side .dot.ok { background:var(--correct); }
.side .dot.bad { background:var(--wrong); }

/* 错题本 */
.wrong-item { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-left:3px solid var(--wrong); border-radius:10px; padding:12px 14px; margin-bottom:10px; font-size:14px; }
.wrong-item .q-tag { flex-shrink:0; }
.wrong-item .w-stem { flex:1; }
.wrong-item .btn-mini { flex-shrink:0; }
.wrong-item .w-level { flex-shrink:0; font-size:12px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--bg); color:var(--muted); white-space:nowrap; }
.wrong-item .w-meta { flex-shrink:0; font-size:11px; color:var(--accent); background:var(--bg); padding:2px 7px; border-radius:5px; white-space:nowrap; }
.wrong-filters { display:flex; gap:10px; flex-wrap:wrap; }
.wrong-filters .search-box { margin-bottom:6px; }
.wrong-filters select.search-box { flex:1; min-width:210px; }
.wrong-filters input.search-box { flex:2; min-width:210px; }
@media (max-width:720px){ .wrong-item .w-meta { display:none; } }

/* 页内对话框 */
#dlg { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:120; display:flex;
  align-items:center; justify-content:center; padding:16px; }
.dlg-box { background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  max-width:540px; width:100%; max-height:82vh; overflow-y:auto; padding:20px 22px;
  box-shadow:0 12px 40px rgba(0,0,0,.35); }
.dlg-title { font-size:17px; font-weight:600; margin-bottom:12px; }
.dlg-body { font-size:14px; line-height:1.85; color:var(--sub); }
.dlg-tip { display:none; margin-top:12px; font-size:13px; line-height:1.7; color:var(--muted);
  background:var(--bg); border-radius:8px; padding:9px 12px; }
.dlg-tip.show { display:block; }
.dlg-tip.ok { color:var(--correct); background:rgba(63,185,80,.10); }
.dlg-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap; }
.dlg-actions .btn { min-width:96px; }

/* 清空成功提示条 */
.reset-banner { background:rgba(63,185,80,.10); border:1px solid var(--correct); color:var(--correct);
  border-radius:var(--radius); padding:12px 16px; margin-bottom:16px; font-size:13.5px; line-height:1.7; }

/* 学习统计 */
.st-trend { display:flex; align-items:flex-end; gap:6px; height:120px; margin:14px 0 6px; }
.st-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
.st-bar { width:100%; max-width:46px; border-radius:5px 5px 0 0; background:var(--accent); min-height:2px; }
.st-bar.empty { background:var(--border); }
.st-day-label { font-size:10px; color:var(--muted); white-space:nowrap; }
.st-day-val { font-size:11px; color:var(--sub); }

/* 题目插图 */
.q-fig { margin:14px 0 4px; text-align:center; }
.q-fig img { max-width:100%; max-height:340px; background:#fff; border:1px solid var(--border);
  border-radius:10px; padding:4px; cursor:zoom-in; }
.q-fig-cap { font-size:12px; color:var(--muted); margin-top:6px; }
#lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:99; display:flex;
  align-items:center; justify-content:center; padding:14px; cursor:zoom-out; }
#lightbox img { max-width:100%; max-height:100%; background:#fff; border-radius:8px; }

/* 配伍题同组小题 */
.sib-box { margin-top:10px; border:1px dashed var(--border); border-radius:10px; padding:10px 12px; background:var(--bg); }
.sib-head { font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; gap:8px; flex-wrap:wrap; }
.sib-tip { color:var(--accent); }
.sib-item { font-size:13.5px; line-height:1.75; padding:3px 6px; border-radius:6px; }
.sib-link { cursor:pointer; transition:background .15s; }
.sib-link:hover { background:var(--card); box-shadow:0 0 0 1px var(--border); }
.sib-link:hover .sib-no { text-decoration:underline; }
.sib-no { display:inline-block; min-width:52px; color:var(--accent); font-weight:500; margin-right:6px; }

/* 模拟考答题卡 */
.exam-top { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.exam-tools { display:flex; gap:8px; }
.anscard { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:14px; }
.anscard-head { font-size:14px; font-weight:500; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.ac-stat { font-size:12px; color:var(--muted); font-weight:400; }
.ac-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(42px,1fr)); gap:6px; margin-top:12px; max-height:300px; overflow-y:auto; }
.card-cell { position:relative; padding:8px 0; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--sub); font-size:13px; cursor:pointer; transition:all .15s; }
.card-cell:hover { border-color:var(--accent); }
.card-cell.done { background:var(--accent); color:#fff; border-color:var(--accent); }
/* 标记待定：红色实心 + 红色外圈，在 120 格里一眼能挑出来 */
.card-cell.marked { background:var(--wrong); color:#fff; border-color:var(--wrong);
  box-shadow:0 0 0 2px rgba(239,68,68,.30); font-weight:700; }
/* 已答且被标记：保留蓝色底（仍看得出已答），外面套一圈粗红环 */
.card-cell.done.marked { background:var(--accent); border-color:#fff; box-shadow:0 0 0 3px var(--wrong); }
.card-cell.marked::after { content:'●'; position:absolute; top:2px; right:4px; font-size:11px; line-height:1; color:#fff;
  text-shadow:0 0 2px rgba(0,0,0,.5); }
.card-cell.done.marked::after { color:var(--wrong); text-shadow:none; }
.card-cell.cellcur { outline:2px solid var(--accent2); outline-offset:1px; }
/* 答题卡图例 */
.ac-legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:12px; color:var(--muted); }
.ac-legend span { display:flex; align-items:center; gap:5px; }
.ac-legend .sw { width:15px; height:15px; border-radius:4px; display:inline-block; border:1px solid var(--border); }
.ac-legend .sw.lg-done { background:var(--accent); border-color:var(--accent); }
.ac-legend .sw.lg-todo { background:var(--bg); }
.ac-legend .sw.lg-mark { background:var(--wrong); border-color:var(--wrong); box-shadow:0 0 0 2px rgba(239,68,68,.30); }
.ac-legend .sw.lg-cur  { background:var(--card); outline:2px solid var(--accent2); outline-offset:1px; }
/* 章节得分分析 */
.ch-row { margin:9px 0; }
.ch-top { display:flex; justify-content:space-between; font-size:13px; gap:10px; }
.ch-name { color:var(--text); }
.ch-val { color:var(--sub); white-space:nowrap; }
.ch-bar { height:6px; border-radius:3px; background:var(--bg); margin-top:4px; overflow:hidden; }
.ch-fill { height:100%; border-radius:3px; }

/* 分类练习 */
.topic-item { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; display:flex; align-items:center; gap:10px; }
.topic-item .t-head { flex:1; }
.topic-item .t-count { color:var(--muted); font-size:12px; margin-left:8px; }

/* 主题按钮 */
.theme-btn { position:fixed; bottom:18px; right:18px; width:44px; height:44px; border-radius:50%; background:var(--card); border:1px solid var(--border); cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:30; transition:all .2s; }
.theme-btn:hover { transform:scale(1.08); }

.footer { text-align:center; padding:18px 0 8px; color:var(--muted); font-size:12px; line-height:1.8; }
</style>
</head>
<body>
<div id="app"></div>
<button class="theme-btn" onclick="toggleTheme()" title="切换主题">🌓</button>

<script>
var BANK = __BANK_DATA__;
var SIMILAR = __SIMILAR_DATA__;
var MEMO = __MEMO__;
var TOTAL = __TOTAL__;
var SINGLE_COUNT = __SINGLE_COUNT__;
var MULTI_COUNT = __MULTI_COUNT__;
var SIMILAR_COUNT = __SIMILAR_COUNT__;
var B_COUNT = __B_COUNT__;
var A_COUNT = __A_COUNT__;
var FIGS = __FIGURES__;
var PAPERS = __PAPERS__;
var CATS = __CATS__;
var CHEAT = __CHEAT__;
// 版本约定（本项目习惯，勿随意改动）：
//   大版本里程碑才进整数（如 v1 → v2），升级前须与核桃确认；
//   小版本号＝自 v1 起累计的更改次数，每次调整 +0.1（v1.0 → v1.1 → v1.2 …）。
//   注意：小数点后是「计数值」不是小数 —— v1.10 表示第 10 次修改，晚于 v1.9，
//         不要按小数理解成 1.10 < 1.9，也不要因此擅自进整数。
//   版本号旁固定标注「本系统由核桃制作」，统一由 footerHTML() 输出，避免多处不一致。
var VERSION = 'v1.16';
var CREDIT = '本系统由核桃制作';
function footerHTML(){
  return '<div class="footer">'+CREDIT+' · '+VERSION+
         '<br>题目与答案以原卷为准，解析供学习参考</div>';
}
var app = document.getElementById('app');

// ========== localStorage ==========
var LS = {
  get:function(k,d){try{var v=localStorage.getItem('med_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set:function(k,v){localStorage.setItem('med_'+k,JSON.stringify(v));}
};

// ========== 全局状态 ==========
var S = { page:'home', mode:'all', qid:null, history:[], answered:false, theme:LS.get('theme','light'),
          resetJustNow:false, resetInfo:null,
          multi_sel:{}, // 多选题已勾选集合
          simFilter:'all', topic:null, skipQid:null, wrongType:'all', wrongCat:'all', wrongQ:'' };

// ========== 间隔重复权重 ==========
function getWeights(){ return LS.get('weights',{}); }
function getWeight(qid){ var w=getWeights(); return (w[qid]!==undefined)?w[qid]:1.0; }
function updateWeight(qid, correct){ var w=getWeights(); var cur=(w[qid]!==undefined)?w[qid]:1.0;
  if(correct) cur=Math.max(0.15, cur*0.5); else cur=Math.min(8.0, cur*2.2); w[qid]=cur; LS.set('weights',w); }
// ===== 统计埋点：按日、按章节 =====
// 只做记录，不影响判分逻辑。
function ymd(d){
  var m = d.getMonth()+1, dd = d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function bumpDaily(correct){
  var k = ymd(new Date());
  var d = LS.get('daily', {});
  if(!d[k]) d[k] = {t:0, c:0};
  d[k].t++; if(correct) d[k].c++;
  var ks = Object.keys(d).sort();
  while(ks.length > 60){ delete d[ks.shift()]; }     // 只留最近 60 天
  LS.set('daily', d);
}
function bumpCat(q, correct){
  if(!q || !q.cat) return;
  var m = LS.get('chstats', {});
  if(!m[q.cat]) m[q.cat] = {t:0, c:0};
  m[q.cat].t++; if(correct) m[q.cat].c++;
  LS.set('chstats', m);
}
function weightedPick(pool){ if(!pool.length) return null; var weights=[],tot=0;
  for(var i=0;i<pool.length;i++){ var ww=getWeight(pool[i]); weights.push(ww); tot+=ww; }
  var r=Math.random()*tot, cum=0; for(var i=0;i<pool.length;i++){ cum+=weights[i]; if(r<=cum) return pool[i]; } return pool[pool.length-1]; }

// ========== 渲染入口 ==========
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  if(S.page==='home') renderHome();
  else if(S.page==='quiz'){ if(S.qid==null){ startQuiz(); return; } renderQuiz(); }
  else if(S.page==='similar') renderSimilar();
  else if(S.page==='cheat') renderCheat();
  else if(S.page==='wrong') renderWrong();
  else if(S.page==='topic') renderTopic();
  else if(S.page==='notes') renderNotes();
  else if(S.page==='stats') renderStats();
  else if(S.page==='exam') renderExam();
  else if(S.page==='setting') renderSetting();
}

function topbar(active){
  var tabs = [
    ['首页','home'],['刷题','quiz'],['错题本','wrong'],['分类练习','topic'],['相似题对比','similar'],['速记手册','cheat'],['复习资料','notes'],['学习统计','stats']
  ];
  var html = '<div class="topbar"><span class="brand">医学综合·冲刺刷题</span><span class="sp"></span>';
  for(var i=0;i<tabs.length;i++){
    html += '<button class="tab-btn '+(active===tabs[i][1]?'active':'')+'" onclick="goTab(\''+tabs[i][1]+'\')">'+tabs[i][0]+'</button>';
  }
  html += '</div>';
  return html;
}
function goTab(p){
  if(p==='quiz' && S.qid==null){ startQuiz(); return; }
  S.page=p; render();
}

// ========== 网课要点数据（由 build_html.py 从 5 课 md + 学习汇总注入）============
var NOTES = __NOTES__;

// ===== 分类维度：章节 / 学科 / 套卷 / 题型 =====
var GROUP_BY = 'chapter';
var GROUP_DESC = { chapter:'按《医学综合复习资料》38 个章节分组，标签由系统自动标注，个别题目可能归错，以解析为准。',
                   part:'按四大部分粗分：人体解剖学 / 生理学 / 内科学基础 / 外科学。这一层最准确。',
                   paper:'按 11 套真题与模拟卷分组，适合成套刷。',
                   type:'按题型分组：A 型（五选一）/ B 型（配伍）/ X 型（多选）。' };
function qtag(q){ if(q.type==='X') return 'X 型题'; if(q.type==='B') return 'B 型题'; return 'A 型题'; }
// ===== 题目插图（内联 base64，点击放大）=====
function figHTML(q){
  if(!q || !q.fig) return '';
  var F = FIGS[q.fig];
  if(!F) return '';
  return '<div class="q-fig"><img src="'+F.d+'" alt="题目插图" onclick="zoomFig(\''+q.fig+'\')">'+
    (F.cap ? '<div class="q-fig-cap">'+F.cap+' · 点击图片放大</div>' : '<div class="q-fig-cap">点击图片放大</div>')+
    '</div>';
}
// ===== 页内对话框 =====
// 浏览器可能屏蔽原生 alert/confirm：桌面端在反复弹出后常被勾选
// 「阻止此页面创建更多对话框」，部分环境（或移动端 webview）也不支持。
// 被屏蔽时 confirm() 会直接返回 false —— 表现就是「点了没反应、什么也没发生」。
// 因此全部改用页内对话框，不依赖浏览器能力。
var DLG_CB = null;
function escHtml(x){
  return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function closeDlg(){
  var d = document.getElementById('dlg');
  if(d && d.parentNode) d.parentNode.removeChild(d);
  DLG_CB = null;
}
// extra：可选的附加操作 {label, fn} —— 点它执行动作但**不关对话框**，
// 用于「清空前先导出备份」这类「提示了就要当场能做」的场景。
function appDialog(title, msg, okText, danger, cb, extra){
  DLG_CB = cb || null;
  var d = document.createElement('div'); d.id = 'dlg';
  var extraBtn = extra ? '<button class="btn btn-ghost" id="dlg-extra">'+escHtml(extra.label)+'</button>' : '';
  var btns = extraBtn + (okText
    ? '<button class="btn btn-ghost" id="dlg-cancel">取消</button>'
      + '<button class="btn '+(danger?'btn-danger':'btn-primary')+'" id="dlg-ok">'+escHtml(okText)+'</button>'
    : '<button class="btn btn-primary" id="dlg-ok">知道了</button>');
  d.innerHTML = '<div class="dlg-box"><div class="dlg-title">'+escHtml(title)+'</div>'
    + '<div class="dlg-body">'+escHtml(msg).replace(/\n/g,'<br>')+'</div>'
    + '<div class="dlg-tip" id="dlg-tip"></div>'
    + '<div class="dlg-actions">'+btns+'</div></div>';
  document.body.appendChild(d);
  var okb = document.getElementById('dlg-ok');
  if(okb) okb.onclick = function(){ var f = DLG_CB; closeDlg(); if(f) f(); };
  var cb2 = document.getElementById('dlg-cancel');
  if(cb2) cb2.onclick = closeDlg;
  var eb = document.getElementById('dlg-extra');
  if(eb) eb.onclick = function(){ extra.fn(); };
}
function appAlert(msg){ appDialog('提示', msg, null, false, null); }
function appConfirm(title, msg, okText, danger, cb, extra){
  appDialog(title, msg, okText||'确定', danger, cb, extra);
}
// 对话框内的即时反馈（导出成功等），不打断当前确认流程
function dlgTip(text, ok){
  var t = document.getElementById('dlg-tip');
  if(!t) return;
  t.textContent = text;
  t.className = 'dlg-tip' + (text ? (ok ? ' ok show' : ' show') : '');
}

// ===== 配伍题的同组小题 =====
// 真实卷面上同一组的小题是并排给出的，刷题时也一并显示，便于对照共用选项作答。
function siblings(q){
  if(!q || !q.shared) return [];
  var out=[];
  for(var i=0;i<BANK.length;i++){
    var x=BANK[i];
    if(x.id!==q.id && x.type==='B' && x.paper===q.paper && x.grp===q.grp) out.push(x);
  }
  return out;
}
function siblingHTML(q){
  var sib=siblings(q); if(!sib.length) return '';
  // 模拟考里要在本卷内跳转（用卷内序号），刷题时直接切到该题（用题库序号）
  var inExam = (S.page==='exam' && !EXAM.finished && EXAM.qlist.length>0);
  var h='<div class="sib-box"><div class="sib-head">同组小题 · 与本題共用上面这组备选答案'
      + '<span class="sib-tip">点击可切换到该题</span></div>';
  for(var i=0;i<sib.length;i++){
    var x=sib[i], act='';
    if(inExam){
      var at = EXAM.qlist.indexOf(x.id);
      if(at>=0) act='onclick="examJump('+at+')"';
    } else {
      act='onclick="practiceOne('+x.id+')"';
    }
    h+='<div class="sib-item'+(act?' sib-link':'')+'" '+act+'>'
      + '<span class="sib-no">第'+x.n+'题</span><span>'+x.s+'</span></div>';
  }
  return h+'</div>';
}
function zoomFig(id){
  var F = FIGS[id]; if(!F) return;
  var d = document.createElement('div'); d.id = 'lightbox';
  d.innerHTML = '<img src="'+F.d+'" alt="放大查看">';

function topicOf(q){

}

// 已做过（去重）：无论对错，答过就计入，用于算"未做题"进度

      LS.set('rounds', getRounds()+1);

    }
    LS.set('done',d);
  }
}

// ========== 刷题 ==========
function startQuiz(){
  // 弱项间隔重练：开启且超间隔 → 优先把错题本塞进本轮前段
  S.weakFirst = [];
  var wr = LS.get('weak_review', {on:false, days:1, last:0});
  if(wr.on && wr.days){
    var passed = (Date.now() - (wr.last||0)) >= wr.days*86400000;
    var wrong = getWrong();
    if(passed && wrong.length){ S.weakFirst = wrong.slice(); wr.last = Date.now(); LS.set('weak_review', wr); }
  }
  S.page='quiz'; S.history=[]; pickNext();
}
function pickNext(){
  var pool=[];
  if(S.mode==='all'){ for(var i=0;i<BANK.length;i++) pool.push(i); }
  else if(S.mode==='typeA'){ for(var i=0;i<BANK.length;i++) if(BANK[i].type==='A') pool.push(i); }
  else if(S.mode==='typeB'){ for(var i=0;i<BANK.length;i++) if(BANK[i].type==='B') pool.push(i); }
  else if(S.mode==='typeX'){ for(var i=0;i<BANK.length;i++) if(BANK[i].type==='X') pool.push(i); }
  else if(S.mode==='weak'){ var w=getWeights(); for(var i=0;i<BANK.length;i++){ if((w[i]||1.0)>=1.5) pool.push(i); } if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='wrong'){ pool=getWrong().slice(); if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='topic'){ if(S.topic!=null){ pool=topicPool(S.topic); if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } } }
  else if(S.mode==='topics'){ var tp=[]; for(var ti=0;ti<S.topics.length;ti++){ tp=tp.concat(topicPool(S.topics[ti])); } pool=tp; if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); } }
  else if(S.mode==='undone'){ var d=getDone(); for(var i=0;i<BANK.length;i++){ if(d.indexOf(i)<0) pool.push(i); } }
  else if(S.mode==='custom'){ pool=(S.custom||[]).slice(); }
  if(!pool.length){ for(var i=0;i<BANK.length;i++) pool.push(i); }
  // 「跳过本题」：本次抽题时把刚跳过的那道剔出去，避免立刻又抽到同一题。
  // 池里只剩一道时不去掉，否则会抽到空。跳过不计入答题记录，也不影响权重。
  if(S.skipQid != null){
    var at = pool.indexOf(S.skipQid);
    if(at >= 0 && pool.length > 1) pool.splice(at, 1);
    S.skipQid = null;
  }
  if(S.weakFirst && S.weakFirst.length){
    var wf = S.weakFirst.shift();           // 优先出弱项错题
    if(pool.indexOf(wf)>=0 || S.mode==='all' || S.mode==='wrong' || S.mode==='weak'){ S.qid=wf; }
    else { S.weakFirst.unshift(wf); S.qid = weightedPick(pool); }
  } else {
    S.qid = weightedPick(pool);
  }
  S.answered=false; S.multi_sel={};
  render();
}

function practiceList(list){

}

    }

  if(S.answered){

      '<div class="explain" style="margin-top:12px"><div class="exp-title">'+expHead(q)+'</div>'+expBody(q)+'</div></div>';
  }

  mainHTML += '<div class="next-hint">'+(S.answered?'点击「下一题」或按 <kbd>空格</kbd>'

  var dots=''; for(var d=0;d<S.history.length;d++){ dots+='<span class="dot '+(S.history[d].correct?'ok':'bad')+'">'+(S.history[d].correct?'✓':'✗')+'</span>'; }

    '<div class="p-row"><span>本题权重</span><b class="'+(qWeight>=2?'red':'green')+'">'+qWeight+'</b></div>'+
    '<div class="p-title" style="margin-top:16px">🔄 本轮 / 全部进度</div>'+

// 答案解析：由选项文本与解析字段在运行时拼装
function expHead(q){ return q.cat + ' · ' + q.paper + ' 第' + q.n + '题'; }
function expBody(q){
  var o={}, i;
  for(i=0;i<q.o.length;i++){ o[q.o[i].k]=q.o[i].t; }
  var ks=q.a.split(''), ans=[];
  for(i=0;i<ks.length;i++){ ans.push(ks[i]+') '+(o[ks[i]]||'')); }
  var h='<div style="margin-bottom:8px">正确答案：<b>'+ans.join('、')+'</b></div>';
  if(q.exp.base) h+='<div style="margin-bottom:8px"><b>【原卷解析】</b>'+q.exp.base+'</div>';
  if(q.exp.ai) h+='<div><b>【AI 解析】</b>'+q.exp.ai+'</div>';
  for(i=0;i<(q.tags?q.tags.length:0);i++){
    h+='<div style="margin-top:8px;color:var(--warn);font-size:12px">'+q.tags[i].text+'</div>';
  }
  return h;
}
function toggleMulti(k){ if(S.answered) return; if(S.multi_sel[k]) delete S.multi_sel[k]; else S.multi_sel[k]=1; renderQuiz(); }
function answer(u){
  if(S.answered) return;
  var q = BANK[S.qid];
  var correct = (u===q.a);
  S.history.push({qid:S.qid, userAns:u, correct:correct});
  S.answered=true; updateWeight(S.qid,correct);
  if(correct) removeWrong(S.qid); else addWrong(S.qid);
  addDone(S.qid);
  var stats=LS.get('stats',{total:0,correct:0}); stats.total++; if(correct) stats.correct++; LS.set('stats',stats);
  bumpDaily(correct); bumpCat(q, correct);
  render();
}
function answerMulti(){
  if(S.answered) return;
  var q = BANK[S.qid];
  var chosenKeys=[], correct=true;
  // 逐一核对
  for(var i=0;i<q.o.length;i++){
    var k=q.o[i].k;
    var chosen = !!S.multi_sel[k];
    var right = q.a.indexOf(k)>=0;
    if(chosen!==right){ correct=false; }
    if(chosen) chosenKeys.push(k);
  }
  var ua = chosenKeys.join('');
  S.history.push({qid:S.qid, userAns:ua, correct:correct});
  S.answered=true; updateWeight(S.qid,correct);
  if(correct) removeWrong(S.qid); else addWrong(S.qid);
  addDone(S.qid);
  var stats=LS.get('stats',{total:0,correct:0}); stats.total++; if(correct) stats.correct++; LS.set('stats',stats);
  bumpDaily(correct); bumpCat(q, correct);
  render();
}

// 筛选逻辑集中一处，列表与计数共用
function filteredWrong(){
  var fType = S.wrongType || 'all', fCat = S.wrongCat || 'all', fQ = S.wrongQ || '';
  return getWrong().filter(function(idx){
    var q = BANK[idx];
    if(!q) return false;
    if(fType !== 'all' && q.type !== fType) return false;
    if(fCat  !== 'all' && (q.cat||'未分类') !== fCat) return false;
    if(fQ && (q.s + q.paper + (q.cat||'')).indexOf(fQ) < 0) return false;
    return true;
  }).sort(function(a,b){ return getWeight(b)-getWeight(a); });
}

function renderTopicList(q){

// 完整渲染一道题（题干+全部选项+答案）
function fullQ(bq, label){
  var ansTxt;
  if(bq.multi){ ansTxt = bq.o.filter(function(o){return bq.a.indexOf(o.k)>=0}).map(function(o){return o.k+') '+o.t}).join('、'); }
  else { var o=bq.o.filter(function(x){return x.k===bq.a})[0]; ansTxt=o?o.k+') '+o.t:''; }
  var opts='';
  for(var j=0;j<bq.o.length;j++){ var o=bq.o[j]; opts+='<div class="opt'+(bq.a.indexOf(o.k)>=0?' ans':'')+'"><span class="ol">'+o.k+'</span><span>'+o.t+'</span></div>'; }
  return '<div class="fullq">'+(label?'<div class="fq-tag">'+label+'</div>':'')+
    '<div class="fq-stem">'+bq.s+'</div>'+
    figHTML(bq)+
    '<div class="fq-opts">'+opts+'</div>'+
    '<div class="fq-ans">答案：<b>'+ansTxt+'</b></div></div>';
}
function memoSection(title, list, tag){
  var out='<div class="memo-sec"><h2>'+title+' <span class="memo-count">'+list.length+' 题</span></h2>';
  for(var i=0;i<list.length;i++){ out+=fullQ(list[i], tag); }
  return out+'</div>';
}
function renderSimilarList(q){
  var el = document.getElementById('sim-list'); if(!el) return;
  var out='';
  if(S.simFilter==='all' || S.simFilter==='memo'){
    var nl=MEMO.num.filter(function(x){return !q || x.s.indexOf(q)>=0 || x.o.some(function(o){return o.t.indexOf(q)>=0;});});
    var ll=MEMO.latin.filter(function(x){return !q || x.s.indexOf(q)>=0 || x.o.some(function(o){return o.t.indexOf(q)>=0;});});
    if(nl.length) out += memoSection('数值 · 单位记忆', nl, '数值');
    if(ll.length) out += memoSection('英文缩写 · 代号', ll, '缩写');
  }
  if(S.simFilter==='all' || S.simFilter==='contrast' || S.simFilter==='variant'){
    for(var i=0;i<SIMILAR.length;i++){
      var g = SIMILAR[i];
      var kn = g.kind || '相似题';
      if(S.simFilter==='contrast' && kn!=='相似题') continue;
      if(S.simFilter==='dup' && kn!=='重复题') continue;
      if(S.simFilter==='variant' && kn!=='同题变体') continue;
      if(q && (g.title+kn).indexOf(q)<0 && !g.lines.some(function(it){return it[1] && it[1].indexOf(q)>=0;})) continue;
      out += '<div class="sim-group '+(kn==='同题变体'?'g-variant':(kn==='重复题'?'g-dup':'g-contrast'))+'">'+
        '<div class="g-head"><span class="g-type">'+kn+'</span><span class="g-title">'+g.title+'</span></div>';
      var ai=0; // ans_list 游标：对比组答案行按 题A→题B 顺序
      for(var j=0;j<g.lines.length;j++){
        var it=g.lines[j];
        var isQA = it[0]==='A'||it[0]==='B';
        if(it[2]){ out += fullQ(it[2], it[0]!=='N'?it[0]:''); }
        else {
          out += '<div class="sim-item">'+(isQA?'<span class="tag">'+it[0]+'：</span>':'')+it[1]+
            (isQA&&g.ans_list&&g.ans_list[ai]?'<div class="sim-ans" style="margin-top:4px">答案：'+g.ans_list[ai]+'</div>':'')+'</div>';
        }
        if(isQA && g.ans_list) ai++;
      }
      if(g.shared_ans) out += '<div class="sim-ans">答案相同：<b>'+g.shared_ans+'</b></div>';
      if(g.variant) out += '<div class="sim-item" style="color:var(--sub)">'+g.variant+'</div>';
      if(g.diff) out += '<div class="sim-diff">⚠ '+g.diff+'</div>';
      out += '</div>';
    }
  }
  el.innerHTML = out || '<div class="card"><p>无匹配。</p></div>';
}

// ========== 学习统计 ==========
function sItem(n,l){ return '<div class="s-item"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>'; }
function renderStats(){
  var stats = LS.get('stats',{total:0,correct:0});
  var daily = LS.get('daily',{});
  var chstats = LS.get('chstats',{});
  var doneN = getDone().length, wrongN = getWrong().length;
  var rate = stats.total>0 ? (stats.correct/stats.total*100).toFixed(1)+'%' : '--';

  var h = topbar('stats');
  h += '<div class="card"><h2>学习总览</h2><div class="stats-grid">'
    + sItem(stats.total,'累计做题') + sItem(rate,'正确率')
    + sItem(doneN,'已做过') + sItem(Math.max(0,TOTAL-doneN),'未做过')
    + sItem(getRounds(),'已完成轮次') + sItem(wrongN,'错题本')
    + '</div>'
    + '<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill" style="width:'
    + (TOTAL>0?doneN/TOTAL*100:0)+'%"></div></div>'
    + '<div class="prog-label">全库进度 <b>'+doneN+'</b> / '+TOTAL+' 题</div></div></div>';

  // 近 7 天
  var days=[], now=new Date();
  for(var i=6;i>=0;i--){
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    var k = ymd(d);
    days.push({label:(d.getMonth()+1)+'/'+d.getDate(), v:daily[k]||{t:0,c:0}});
  }
  var maxT = 1;
  for(var a=0;a<days.length;a++){ if(days[a].v.t > maxT) maxT = days[a].v.t; }
  h += '<div class="card"><h2>近 7 天做题量</h2><div class="st-trend">';
  for(var j=0;j<days.length;j++){
    var dd=days[j], pct = dd.v.t ? Math.max(6, Math.round(dd.v.t/maxT*100)) : 0;
    h += '<div class="st-day"><div class="st-day-val">'+(dd.v.t?dd.v.t:'')+'</div>'
      + '<div class="st-bar'+(dd.v.t?'':' empty')+'" style="height:'+(dd.v.t?pct:2)+'%"></div>'
      + '<div class="st-day-label">'+dd.label+'</div></div>';
  }
  h += '</div>';
  var wt=0, wc=0;
  for(var b2=0;b2<days.length;b2++){ wt+=days[b2].v.t; wc+=days[b2].v.c; }
  h += '<p style="color:var(--sub);font-size:13px;text-align:center;margin-top:6px">近 7 天共 '
    + wt + ' 题' + (wt ? '，正确率 '+Math.round(wc/wt*100)+'%' : '') + '</p></div>';

  // 章节掌握度：正确率升序，最该补的排最前
  var rows=[];
  for(var c in chstats){ if(chstats[c].t>0) rows.push({c:c, t:chstats[c].t, k:chstats[c].c}); }
  rows.sort(function(x,y){ return (x.k/x.t) - (y.k/y.t); });
  h += '<div class="card"><h2>章节掌握度 <span style="color:var(--sub);font-size:13px">共 '
    + rows.length + ' 章有记录 · 按正确率由低到高排</span></h2>';
  if(!rows.length){
    h += '<p style="color:var(--sub);line-height:1.8">还没有章节数据。做几道题就会自动统计，'
       + '用来定位该补哪一章。</p>';
  } else {
    for(var m=0;m<rows.length;m++){
      var r=rows[m], pct2=Math.round(r.k/r.t*100);
      var col = pct2>=60 ? 'var(--correct)' : (pct2>=40 ? 'var(--warn)' : 'var(--wrong)');
      h += '<div class="ch-row"><div class="ch-top"><span class="ch-name">'+(pct2<60?'⚠ ':'')+r.c+'</span>'
        + '<span class="ch-val">'+r.k+'/'+r.t+' · '+pct2+'%</span></div>'
        + '<div class="ch-bar"><div class="ch-fill" style="width:'+pct2+'%;background:'+col+'"></div></div></div>';
    }
  }
  h += '</div>';

  // ===== 模拟考成绩历史 =====
  var ehist = LS.get('examHistory', []);
  h += '<div class="card"><h2>模拟考成绩 <span style="color:var(--sub);font-size:13px">共 '
    + ehist.length + ' 次</span></h2>';
  if(!ehist.length){
    h += '<p style="color:var(--sub);line-height:1.8">还没有模拟考记录。去「模拟考试」考一次，'
       + '成绩会自动记在这里，方便追踪进步。</p>';
  } else {
    // 分数走势（迷你柱状，按时间顺序，及格线 60% 用红虚线标注）
    var ehMax = 100, ehN = ehist.length;
    h += '<div class="st-trend" style="height:110px">';
    for(var ei=0; ei<ehN; ei++){
      var eh = ehist[ei], pctE = eh.rate;
      var ehH = pctE > 0 ? Math.max(8, Math.round(pctE)) : 2;
      var ehCol = pctE>=60 ? 'var(--correct)' : (pctE>=40 ? 'var(--warn)' : 'var(--wrong)');
      h += '<div class="st-day eh-col"><div class="st-day-val" style="font-size:10px">'+pctE+'%</div>'
        + '<div class="st-bar'+(pctE===0?' empty':'')+'" style="height:'+ehH+'%;background:'+ehCol+'"></div>'
        + '<div class="st-day-label" style="font-size:9px">'+(ehN-ei)+'</div></div>';
    }
    h += '</div>';
    h += '<p style="color:var(--muted);font-size:12px;text-align:center;margin:2px 0 10px">'
      + '每次模拟考正确率（按时间先后，柱越高越好；60% 为及格线）</p>';
    // 历史列表（新的在前）
    h += '<div style="max-height:280px;overflow-y:auto">';
    for(var ei2=ehN-1; ei2>=0; ei2--){
      var eh2 = ehist[ei2];
      var d2 = new Date(eh2.ts);
      var dt2 = (d2.getMonth()+1)+'/'+d2.getDate()+' '+('0'+d2.getHours()).slice(-2)+':'+('0'+d2.getMinutes()).slice(-2);
      var pass2 = eh2.rate>=60;
      h += '<div class="p-row" style="padding:7px 0">'
        + '<span>'+dt2+' · '+(eh2.total||'')+' 题</span>'
        + '<b style="color:'+(pass2?'var(--correct)':'var(--wrong)')+'">'+eh2.cor+'/'+eh2.total+' · '+eh2.rate+'%'
        + (pass2?' ✅':' ❌')+'</b></div>';
    }
    h += '</div>';
    h += '<p style="color:var(--muted);font-size:11px;margin-top:8px">'
      + '历史保存在本机，可通过「导出进度」备份。最多保留最近 50 次。</p>';
  }
  h += '</div>';
  h += footerHTML();
  app.innerHTML = h;
}

function startExamTimer(){
  EXAM.deadline = Date.now() + EXAM.minutes*60000;
  if(EXAM.timer) clearInterval(EXAM.timer);
  EXAM.timer = setInterval(examTick, 1000);
}
// 整套卷：按原卷题号顺序出题
function startPaper(name){
  var ids=[];
  for(var i=0;i<BANK.length;i++){ if(BANK[i].paper===name) ids.push(i); }
  if(!ids.length){ appAlert('未找到该套卷的题目。'); return; }
  ids.sort(function(x,y){ return BANK[x].n - BANK[y].n; });
  EXAM.qlist=ids; EXAM.idx=0; EXAM.answers={}; EXAM.finished=false; EXAM.marked={}; EXAM.cardOpen=false;
  EXAM.minutes = Math.max(30, Math.round(ids.length*1.25));
  startExamTimer();

// 自由抽题：B 型题按组抽，保证同组小题同行出现
function startExam(){
  var pa=[], pbMap={}, pbOrder=[], px=[];
  for(var i=0;i<BANK.length;i++){
    var q=BANK[i];
    if(q.type==='X'){ px.push(i); }
    else if(q.type==='B'){
      var gk=q.paper+'|'+q.grp;
      if(!pbMap[gk]){ pbMap[gk]=[]; pbOrder.push(gk); }
      pbMap[gk].push(i);
    } else { pa.push(i); }
  }
  function pick(arr,n){ var a=arr.slice(), out=[]; for(var k=0;k<n&&a.length;k++){ out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]); } return out; }
  var qlist = pick(pa, EXAM.a);
  qlist = qlist.concat(pickBGroups(pbOrder, pbMap, EXAM.b));
  qlist = qlist.concat(pick(px, EXAM.x));
  if(!qlist.length){ appAlert('题量设置为 0，请先拖动滑块设置题目数量。'); return; }
  EXAM.qlist=qlist; EXAM.idx=0; EXAM.answers={}; EXAM.finished=false; EXAM.marked={}; EXAM.cardOpen=false;
  startExamTimer();
  S.page='exam';
  render();
}
// 按「题量」抽 B 型题组：组内小题数并不固定（多数 2 题，个别 4 题共用同一组备选项），
// 若按「组数」抽（ceil(目标/2) 组）会在抽到 4 题组时多出 2 题，题量就不是设定的 120 了。
function pickBGroups(order, map, target){
  var keys = order.slice(), i, j, t;
  for(i=keys.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=keys[i]; keys[i]=keys[j]; keys[j]=t; }
  var chosen=[], acc=0;
  for(i=0;i<keys.length;i++){                       // 第一轮：只取不会超出的组
    if(acc + map[keys[i]].length <= target){ chosen.push(keys[i]); acc += map[keys[i]].length; }
    if(acc === target) break;
  }
  if(acc < target){                                 // 第二轮：还差就补最小的组（允许小幅超出）
    var rest=[];
    for(i=0;i<keys.length;i++){ if(chosen.indexOf(keys[i])<0) rest.push(keys[i]); }
    rest.sort(function(a,b){ return map[a].length - map[b].length; });
    for(i=0;i<rest.length;i++){ chosen.push(rest[i]); acc += map[rest[i]].length; if(acc>=target) break; }
  }
  var out=[];
  for(i=0;i<chosen.length;i++){ out = out.concat(map[chosen[i]]); }
  return out;
}

function finishExam(){
  if(EXAM.timer){ clearInterval(EXAM.timer); EXAM.timer=null; }
  EXAM.finished = true;
  var wrong=getWrong();
  var stats=LS.get('stats',{total:0,correct:0});
  var done=getDone();
  var byType={A:{c:0,n:0},B:{c:0,n:0},X:{c:0,n:0}};
  var cor=0;
  for(var i=0;i<EXAM.qlist.length;i++){
    var q=BANK[EXAM.qlist[i]], ans=EXAM.answers[EXAM.qlist[i]]||[];
    var ok = ans.length>0 && ans.slice().sort().join('')===q.a.split('').sort().join('');
    stats.total++; if(ok){ stats.correct++; cor++; }
    bumpDaily(ok); bumpCat(q, ok);
    if(byType[q.type]){ byType[q.type].n++; if(ok) byType[q.type].c++; }
    if(ans.length>0 && done.indexOf(EXAM.qlist[i])<0) done.push(EXAM.qlist[i]);
    if(!ok && wrong.indexOf(EXAM.qlist[i])<0) wrong.push(EXAM.qlist[i]);
  }
  LS.set('stats', stats); LS.set('wrong', wrong); LS.set('done', done);

  // 记录一次模拟考成绩（用于学习统计里的历史与走势）
  var tot = EXAM.qlist.length;
  var hist = LS.get('examHistory', []);
  hist.push({ ts: Date.now(),
    total: tot, cor: cor,
    rate: tot ? Math.round(cor / tot * 1000) / 10 : 0,
    a: byType.A.c, an: byType.A.n, b: byType.B.c, bn: byType.B.n, x: byType.X.c, xn: byType.X.n });
  while(hist.length > 50) hist.shift();
  LS.set('examHistory', hist);

  render();
}
function examReport(){
  var tot=EXAM.qlist.length, cor=0, wrongList=[];
  var byType={A:{c:0,n:0},B:{c:0,n:0},X:{c:0,n:0}};
  var chMap={}, chOrder=[];
  for(var i=0;i<tot;i++){
    var q=BANK[EXAM.qlist[i]], ans=EXAM.answers[EXAM.qlist[i]]||[];
    var ok = ans.length>0 && ans.slice().sort().join('')===q.a.split('').sort().join('');
    if(byType[q.type]){ byType[q.type].n++; if(ok) byType[q.type].c++; }
    var cat = q.cat || '未分类';
    if(!chMap[cat]){ chMap[cat] = {n:0, c:0}; chOrder.push(cat); }
    chMap[cat].n++; if(ok) chMap[cat].c++;
    if(ok) cor++; else wrongList.push(EXAM.qlist[i]);
  }
  var rate = tot ? cor/tot : 0;
  var pass = rate >= 0.6;
  var h = '<div class="report-box"><h2 style="text-align:center">模拟考试报告</h2>'+
    '<div class="report-score '+(pass?'report-pass':'report-fail')+'">'+cor+' / '+tot+'</div>'+
    '<p style="text-align:center;color:var(--muted)">正确率 '+Math.round(rate*100)+'% · '+(pass?'✅ 达标（≥60%）':'❌ 未达标')+'</p>';
  for(var t in byType){
    if(byType[t].n) h += '<div class="p-row"><span>'+EXAM_TNAME[t]+'</span><b>'+byType[t].c+' / '+byType[t].n+'</b></div>';
  }

    '<p class="desc" style="color:var(--muted);font-size:12px;margin-top:8px">错题已自动加入「错题本」，可在刷题时重点练习。</p>'+
    '<div class="spaced" style="justify-content:center;margin-top:12px"><button class="btn btn-primary" onclick="examRestart()">再考一次</button>'+

    '<button class="btn btn-ghost" onclick="goTab(\'home\')">返回首页</button></div></div>';

  // 章节得分分析：按正确率升序，最该补的排最前
  chOrder.sort(function(a,b){ return (chMap[a].c/chMap[a].n) - (chMap[b].c/chMap[b].n); });
  h += '<div class="card" style="margin-top:16px"><h2>章节得分分析</h2>'+
    '<p style="color:var(--muted);font-size:12px;margin:0 0 10px">按正确率由低到高排——排在最前面的就是最该回头补的章节。'
    + '正确率低于 60% 的会额外标出，样本只有 1 题的章节参考价值有限。</p>';
  for(var ci=0;ci<chOrder.length;ci++){
    var cat2=chOrder[ci], st=chMap[cat2];
    var r = st.n ? st.c/st.n : 0;
    var pct = Math.round(r*100);
    var col = r>=0.6 ? 'var(--correct)' : (r>=0.4 ? 'var(--warn)' : 'var(--wrong)');
    h += '<div class="ch-row"><div class="ch-top">'+
      '<span class="ch-name">'+(r<0.6?'⚠ ':'')+cat2+'</span>'+
      '<span class="ch-val">'+st.c+'/'+st.n+' · '+pct+'%</span></div>'+
      '<div class="ch-bar"><div class="ch-fill" style="width:'+pct+'%;background:'+col+'"></div></div></div>';
  }
  h += '</div>';
  if(wrongList.length){
    h += '<div class="card" style="margin-top:16px"><h2>本次错题回顾</h2>';
    for(var w=0;w<wrongList.length;w++){
      var q2=BANK[wrongList[w]];
      h += '<div class="sim-item"><div class="g-title">'+q2.paper+' 第'+q2.n+'题 · '+q2.s+'</div>'+figHTML(q2)+'<div class="options" style="margin:8px 0">';
      var userAns = EXAM.answers[wrongList[w]]||[];
      for(var o=0;o<q2.o.length;o++){
        var kk=q2.o[o].k;
        var isRight = q2.a.indexOf(kk)>=0;
        var isUser = userAns.indexOf(kk)>=0;
        var cls = isRight ? 'correct' : (isUser ? 'wrong' : 'dim');

        h += '<div class="option '+cls+'" style="cursor:default"><span class="letter">'+kk+'</span><span>'+q2.o[o].t+mark+'</span></div>';
      }
      h += '</div><div class="sim-ans">正确答案：<b>'+q2.a+'</b>'+(userAns.length?' · 你的选择：'+userAns.slice().sort().join('') : ' · 未作答')+'</div>'+
        (q2.exp.ai ? '<div class="sim-item" style="color:var(--sub)">'+q2.exp.ai+'</div>' : '')+'</div>';
    }
    h += '</div>';
  }
  return topbar('exam') + h;

function applyImport(d, w, dn, wt, dropped){
  if(d.stats) LS.set('stats', d.stats);
  if(w) LS.set('wrong', w);
  if(dn) LS.set('done', dn);
  if(d.rounds!=null) LS.set('rounds', d.rounds);
  if(wt) LS.set('weights', wt);
  if(d.daily && typeof d.daily==='object') LS.set('daily', d.daily);
  if(d.chstats && typeof d.chstats==='object') LS.set('chstats', d.chstats);
  if(Array.isArray(d.examHistory)) LS.set('examHistory', d.examHistory.filter(function(x){
    return x && typeof x.ts==='number' && typeof x.cor==='number' && typeof x.total==='number'; }));
  if(d.weak_review) LS.set('weak_review', Object.assign({on:false,days:1,last:0}, d.weak_review));
  appAlert('导入完成。' + (dropped>0 ? '\n已丢弃 ' + dropped + ' 条不属于本题库的记录。' : ''));
  render();
}
function exportData(){
  var data={ v:VERSION, total:TOTAL, exportAt:Date.now(),
    stats:LS.get('stats',{}), wrong:LS.get('wrong',[]), done:LS.get('done',[]),
    rounds:LS.get('rounds',0), weights:LS.get('weights',{}),
    daily:LS.get('daily',{}), chstats:LS.get('chstats',{}),
    weak_review:LS.get('weak_review',{on:false,days:1,last:0}) };

  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);

// 导入必须校验：题号是「题库下标」，换了题库（比如导入了别的科目的备份）就整体错位，
// 会把毫不相干的题标成错题。这里逐条校验范围与类型，越界的丢弃并如实告知。
function importData(input){
  if(!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var d = JSON.parse(e.target.result);
      if(!d || typeof d!=='object' || Array.isArray(d)) throw new Error('bad');
      var dropped = 0, seen = 0;
      function cleanIdx(arr){
        if(!Array.isArray(arr)) return null;
        seen += arr.length;
        return arr.filter(function(x){
          var ok = typeof x==='number' && isFinite(x) && x>=0 && x<BANK.length && x===Math.floor(x);
          if(!ok) dropped++;
          return ok;
        });
      }
      var w = cleanIdx(d.wrong), dn = cleanIdx(d.done);
      var wt = null;
      if(d.weights && typeof d.weights==='object' && !Array.isArray(d.weights)){
        wt = {};
        for(var k in d.weights){
          var ki = Number(k);
          if(isFinite(ki) && ki>=0 && ki<BANK.length && ki===Math.floor(ki)) wt[k] = d.weights[k];
          else dropped++;
        }
      }
      var wrongTotal = (w ? w.length : 0);
      var msg = '将导入学习进度：\n错题本 ' + wrongTotal + ' 题 · 已做题 ' + (dn ? dn.length : 0)
              + ' 题 · 已完成 ' + (d.rounds || 0) + ' 轮';
      if(d.v) msg += '\n\n备份版本：' + d.v + '（当前 ' + VERSION + '）';
      if(d.total && d.total !== TOTAL){
        msg += '\n\n⛔ 该备份属于另一个题库（'+d.total+' 题，当前题库 '+TOTAL+' 题），'
             + '题号无法对应，导入后错题本会张冠李戴。\n建议不要导入。';
      }
      if(dropped > 0){
        msg += '\n\n⚠ 有 ' + dropped + ' 条记录不属于当前题库（共 ' + TOTAL + ' 题），将被丢弃。';
      }
      msg += '\n\n导入会覆盖当前进度，确定继续吗？';
      appConfirm('导入学习进度', msg, '确定导入', false, function(){
            applyImport(d, w, dn, wt, dropped);
          });
    }catch(err){ appAlert('导入失败：文件格式不正确。'); }
  };
  reader.readAsText(input.files[0]);
}

    '<div class="p-row"><span>题库构成</span><b>A 型 '+CHEAT.na+' · B 型 '+CHEAT.nb+' · X 型 '+CHEAT.nx+'</b></div>'+
    '<h3 style="margin:16px 0 8px;font-size:14px">A / B 型题（单选）答案落点</h3>';
  for(var i=0;i<CHEAT.singles.length;i++){
    h += '<div class="p-row"><span>选项 '+CHEAT.singles[i].k+'</span><b>'+CHEAT.singles[i].n+' 题 · '+CHEAT.singles[i].pct+'%</b></div>';
  }
  h += '<h3 style="margin:16px 0 8px;font-size:14px">X 型题（多选）正确项个数</h3>';
  for(var j=0;j<CHEAT.multis.length;j++){
    h += '<div class="p-row"><span>正确项 '+CHEAT.multis[j].k+' 个</span><b>'+CHEAT.multis[j].n+' 题 · '+CHEAT.multis[j].pct+'%</b></div>';
  }
  h += '</div>';
  h += '<div class="card"><h2>章节题量分布</h2>'+
    '<input class="search-box" type="text" placeholder="搜索章节（如：解剖学、呼吸）" oninput="filterKn(this.value)" />';
  for(var c=0;c<CATS.length;c++){
    h += '<div class="kn-cat"><div class="topic-item" style="margin:0"><div class="t-head"><b>'+CATS[c].name+'</b><span class="t-count">'+CATS[c].count+' 题</span></div>'+
      '<button class="btn btn-ghost btn-mini" onclick="startCat(\''+CATS[c].name.replace(/'/g,"\\'")+'\')">练习</button></div></div>';
  }
  h += '</div>';
  app.innerHTML = h;
}
function filterKn(v){
  var cats=document.querySelectorAll('.kn-cat');
  for(var i=0;i<cats.length;i++){
    cats[i].style.display=(v && cats[i].textContent.indexOf(v)<0)?'none':'';
  }
}
// ===== 手机滑动手势 =====
// 从右往左滑 = 下一题；模拟考里从左往右滑 = 上一题。
// 只认「横向位移足够大、纵向很小、时间短」的手势，避免与上下滚动/点按误触。
var SWIPE = { x:0, y:0, t:0 };
function swipeBlocked(){
  return !!document.getElementById('dlg') || !!document.getElementById('lightbox');
}
document.addEventListener('touchstart', function(e){
  if(e.touches.length!==1 || swipeBlocked()) { SWIPE.t=0; return; }
  SWIPE.x = e.touches[0].clientX; SWIPE.y = e.touches[0].clientY; SWIPE.t = Date.now();
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!SWIPE.t) return;
  var dx = e.changedTouches[0].clientX - SWIPE.x;
  var dy = e.changedTouches[0].clientY - SWIPE.y;
  var dt = Date.now() - SWIPE.t;
  SWIPE.t = 0;
  if(swipeBlocked() || dt>800) return;
  if(Math.abs(dx) < 70 || Math.abs(dy) > 50) return;   // 不够横向、或更像上下滚动
  if(S.page==='quiz'){
    if(dx<0){                                          // 右→左 = 下一题
      if(S.answered) pickNext();                       // 未作答时不响应，避免误滑跳题
    }
    return;
  }
  if(S.page==='exam'){
    if(dx<0){ if(EXAM.idx<EXAM.qlist.length-1) examNext(); }
    else   { examPrev(); }
  }
}, {passive:true});

// ========== 通用 ==========
function goHome(){ S.page='home'; render(); }
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ closeLightbox(); closeDlg(); return; }
  if(S.page!=='quiz') return;
  if(e.code==='Space'){ e.preventDefault(); if(S.answered) pickNext(); }
});
function toggleTheme(){ S.theme=S.theme==='light'?'dark':'light'; LS.set('theme',S.theme); render(); }
function resetAll(){
  var st = LS.get('stats', {total:0, correct:0});
  var nWrong = LS.get('wrong',[]).length;
  var nDone  = LS.get('done',[]).length;
  var rounds = LS.get('rounds', 0);
  var nWt    = Object.keys(LS.get('weights',{})).length;
  var nDaily = Object.keys(LS.get('daily',{})).length;
  var nCat   = Object.keys(LS.get('chstats',{})).length;

  var keys = [];
  for(var i=0;i<localStorage.length;i++){
    var k = localStorage.key(i);
    if(k.indexOf('med_')===0) keys.push(k);
  }
  if(!keys.length){
    appAlert('当前本来就没有学习数据，无需清空。');
    return;
  }

  // 第一次确认：把「将失去什么」逐项列清楚，而不是一句笼统的警告
  var detail = '确定要清空全部学习数据吗？（此操作不可恢复）\n\n将清除的内容：\n'
    + '· 答题统计：累计 ' + st.total + ' 题（答对 ' + st.correct + ' 题）\n'
    + '· 错题本：' + nWrong + ' 题\n'
    + '· 已做记录：' + nDone + ' 题\n'
    + '· 已完成轮次：' + rounds + ' 轮\n'
    + '· 题目权重：' + nWt + ' 项\n'
    + '· 按日统计：' + nDaily + ' 天\n'
    + '· 章节掌握度：' + nCat + ' 章\n'
    + '· 模拟考成绩：' + LS.get('examHistory', []).length + ' 次\n\n'
    + '共 ' + keys.length + ' 项存储记录将被删除。\n\n'
    + '清空后无法恢复。建议先点下面的「先导出备份」存一份。';
  appConfirm('清空所有学习数据', detail, '继续', true, function(){
    var again = '点击「确认清空」后，' + st.total + ' 题的学习记录会立即清空，无法找回。\n\n'
      + '还没备份的话，请点「取消」返回设置页导出。';
    appConfirm('第二次确认（共需确认两次）', again, '确认清空', true, function(){
      doReset(keys, st, nWrong, nDone, rounds);
    });
  }, { label:'⬇ 先导出备份', fn:function(){
        exportData();
        dlgTip('备份已导出（JSON 文件已保存到下载文件夹）。现在可以放心继续，或点「取消」。', true);
      } });
}

// 实际的清空动作（两次确认都通过后才执行）
function doReset(keys, st, nWrong, nDone, rounds){
  for(var j=0;j<keys.length;j++) localStorage.removeItem(keys[j]);

  // 同时清掉内存里的状态：否则刚清完，页面里还残留旧的答题记录、筛选条件、考试进度
  S.history=[]; S.qid=null; S.answered=false; S.multi_sel={}; S.skipQid=null;
  S.wrongType='all'; S.wrongCat='all'; S.wrongQ=''; S.custom=[];
  S.weakFirst=null; S.topic=null; S.simFilter='all';
  EXAM.qlist=[]; EXAM.idx=0; EXAM.answers={}; EXAM.finished=false;
  EXAM.marked={}; EXAM.cardOpen=false;
  if(EXAM.timer){ clearInterval(EXAM.timer); EXAM.timer=null; }

  S.theme = LS.get('theme','light');
  S.resetInfo = { keys:keys.length, total:st.total, wrong:nWrong, done:nDone, rounds:rounds };
  S.resetJustNow = true;
  S.page='home'; render();

  appAlert('已清空全部学习数据\n\n'
    + '清除 ' + keys.length + ' 项记录：累计答题 ' + st.total + ' 题、错题本 ' + nWrong
    + ' 题、已做记录 ' + nDone + ' 题、轮次 ' + rounds + ' 轮。\n\n'
    + '进度已归零，可以重新开始。');
}

S.theme=LS.get('theme','light');
render();

// ===== PWA：注册 Service Worker（离线可用 + 可添加到主屏）=====
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* 静默：不支持或不成功不影响使用 */ });
  });
}
</script>
